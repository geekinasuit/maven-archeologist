# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Mount caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.m2/repository
        key: caches-${{ runner.os }}
    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
        mkdir -p "${GITHUB_WORKSPACE}/bin/"
        mv bazelisk-linux-amd64 "${GITHUB_WORKSPACE}/bin/bazel"
        chmod a+x "${GITHUB_WORKSPACE}/bin/bazel"
    - name: Build All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //...
    - name: Test All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" test //...

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Mount caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.m2/repository
        key: caches-${{ runner.os }}
    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-darwin-arm64"
        mkdir -p "${GITHUB_WORKSPACE}/bin/"
        mv bazelisk-darwin-arm64 "${GITHUB_WORKSPACE}/bin/bazel"
        chmod a+x "${GITHUB_WORKSPACE}/bin/bazel"
    - name: Build All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //...
    - name: Test All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" test //...
