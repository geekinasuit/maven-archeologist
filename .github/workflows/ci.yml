# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Mount caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.m2/repository
        key: caches-${{ runner.os }}
    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
        mkdir -p "${GITHUB_WORKSPACE}/bin/"
        mv bazelisk-linux-amd64 "${GITHUB_WORKSPACE}/bin/bazel"
        chmod a+x "${GITHUB_WORKSPACE}/bin/bazel"
    - name: Build All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //...
    - name: Test All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" test //...

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Mount caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/.m2/repository
        key: caches-${{ runner.os }}
    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-darwin-arm64"
        mkdir -p "${GITHUB_WORKSPACE}/bin/"
        mv bazelisk-darwin-arm64 "${GITHUB_WORKSPACE}/bin/bazel"
        chmod a+x "${GITHUB_WORKSPACE}/bin/bazel"
    - name: Build All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" build //...
    - name: Test All
      run: |
        "${GITHUB_WORKSPACE}/bin/bazel" test //...

  # Unit tests for the kotlin *.main.kts tooling under scripts/ (deploy command assembly, repo
  # selection, version parsing). Pure JVM — needs kotlin + a JDK, not bazel.
  script-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Mount caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.kotlin
        key: script-tests-${{ runner.os }}
    - name: Install Kotlin
      run: |
        curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-compiler-2.4.20.zip"
        unzip -q /tmp/kotlin.zip -d "${HOME}"
        echo "${HOME}/kotlinc/bin" >> "${GITHUB_PATH}"
    - name: Run script tests
      run: |
        ./scripts/run-script-tests.sh
